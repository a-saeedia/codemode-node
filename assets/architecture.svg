<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="codemode-node architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080B12"/>
      <stop offset="1" stop-color="#0B111C"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#121A28" stroke-width="1"/>
    </pattern>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3A4B66"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#grid)" opacity="0.6"/>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#7C8AA5">
    <text x="40" y="40">how one call becomes N tool calls</text>
  </g>

  <!-- client -->
  <rect x="420" y="70" width="360" height="64" rx="12" fill="#0F1626" stroke="#243247"/>
  <text x="600" y="98" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="16" fill="#E8EDF7">MCP client (Claude, Cursor, OpenCode…)</text>
  <text x="600" y="119" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#5C6B85">sees exactly 1 tool</text>

  <line x1="600" y1="134" x2="600" y2="176" stroke="#3A4B66" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="612" y="160" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#4E5F7A">stdio</text>

  <!-- server -->
  <rect x="300" y="180" width="600" height="120" rx="14" fill="#0D1524" stroke="#22D3EE" stroke-opacity="0.45"/>
  <text x="324" y="208" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#22D3EE">codemode-node</text>
  <text x="324" y="236" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#9FB0C9">codeMcpServer()</text>
  <text x="324" y="256" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#5C6B85">Cloudflare's package — type gen, tool description, truncation</text>

  <rect x="640" y="196" width="236" height="30" rx="8" fill="#101B2E" stroke="#2A3B55"/>
  <text x="758" y="216" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#F2C14E">tool: code</text>

  <!-- split -->
  <line x1="450" y1="300" x2="450" y2="352" stroke="#3A4B66" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="750" y1="300" x2="750" y2="352" stroke="#3A4B66" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- host tools -->
  <rect x="150" y="356" width="420" height="150" rx="14" fill="#0F1626" stroke="#243247"/>
  <text x="174" y="384" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" fill="#E8EDF7">host tools</text>
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#8FA1BC">
    <text x="174" y="412">shell · fs · http</text>
    <text x="174" y="434">cf_* (optional)</text>
    <text x="174" y="456">mcp_call → pooled servers</text>
  </g>
  <text x="174" y="484" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#4E5F7A">no secrets read from disk</text>

  <!-- executor -->
  <rect x="620" y="356" width="430" height="150" rx="14" fill="#0F1626" stroke="#F2C14E" stroke-opacity="0.35"/>
  <text x="644" y="384" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" fill="#E8EDF7">NodeExecutor</text>
  <text x="644" y="410" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#5C6B85">implements Executor</text>
  <rect x="644" y="424" width="180" height="56" rx="10" fill="#141C2B" stroke="#2A3B55"/>
  <text x="734" y="446" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#9FB0C9">node child</text>
  <text x="734" y="465" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#4E5F7A">fresh per call</text>
  <text x="844" y="446" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#5C6B85">node:vm</text>
  <text x="844" y="465" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#5C6B85">no require()</text>

  <!-- pooled servers -->
  <rect x="300" y="524" width="600" height="22" rx="6" fill="none"/>
  <text x="600" y="538" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#3E4C63">your MCP servers — pooled, including the ones you disabled</text>

  <text x="1100" y="40" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#2E3A4D">v0.1.0</text>
</svg>
