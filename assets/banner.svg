<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="codemode-node — one tool, every tool">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090F"/>
      <stop offset="0.55" stop-color="#0A0F1A"/>
      <stop offset="1" stop-color="#0D1422"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#F2C14E"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#141B2B" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.7"/>
  <circle cx="1040" cy="180" r="300" fill="url(#glow)"/>

  <!-- mark: many tools collapse into one -->
  <g transform="translate(72 150)" fill="none" stroke="url(#mark)" stroke-width="2">
    <path d="M0 4h48M0 22h48M0 40h48M0 58h48M0 76h48" opacity="0.18"/>
    <path d="M48 4c30 0 30 36 54 36M48 22c30 0 30 18 54 18M48 40h54M48 58c30 0 30-18 54-18M48 76c30 0 30-36 54-36" opacity="0.55"/>
    <circle cx="102" cy="40" r="9" fill="#F2C14E" stroke="none"/>
    <circle cx="102" cy="40" r="17" opacity="0.5"/>
  </g>
  <g fill="#22D3EE" opacity="0.9">
    <circle cx="72" cy="154" r="3"/><circle cx="72" cy="172" r="3"/><circle cx="72" cy="190" r="3"/>
    <circle cx="72" cy="208" r="3"/><circle cx="72" cy="226" r="3"/>
  </g>

  <!-- wordmark -->
  <text x="248" y="176" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#E8EDF7">codemode<tspan fill="#22D3EE" font-weight="400">-node</tspan></text>
  <text x="252" y="216" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#7C8AA5">one tool. every tool<tspan fill="#F2C14E">.</tspan></text>

  <!-- stat chips -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#9FB0C9">
    <rect x="252" y="248" width="200" height="34" rx="17" fill="#101827" stroke="#1E2A3F"/>
    <text x="270" y="270">113 tools → 1</text>
    <rect x="464" y="248" width="300" height="34" rx="17" fill="#101827" stroke="#1E2A3F"/>
    <text x="482" y="270">43.6k → 1.6k tokens / request</text>
    <rect x="776" y="248" width="86" height="34" rx="17" fill="#101827" stroke="#1E2A3F"/>
    <text x="797" y="270">MIT</text>
    <rect x="874" y="248" width="196" height="34" rx="17" fill="#101827" stroke="#1E2A3F"/>
    <text x="894" y="270">no Workers account</text>
  </g>
</svg>
