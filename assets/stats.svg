<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="43,602 tokens versus 1,631 tokens per request">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080B12"/>
      <stop offset="1" stop-color="#0B111C"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2C14E"/>
      <stop offset="1" stop-color="#E4584B"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" rx="16" fill="url(#bg)"/>
  <text x="44" y="52" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#7C8AA5">what your agent reads before you type a word</text>

  <!-- without -->
  <text x="44" y="104" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#9FB0C9">8 MCP servers · 113 tools</text>
  <rect x="44" y="116" width="880" height="34" rx="8" fill="#111826"/>
  <rect x="44" y="116" width="880" height="34" rx="8" fill="url(#hot)">
    <animate attributeName="width" from="0" to="880" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="44" y="176" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#E4584B">43,602 tokens</text>

  <!-- with -->
  <text x="44" y="222" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#9FB0C9">codemode-node · 1 tool</text>
  <rect x="44" y="234" width="880" height="34" rx="8" fill="#111826"/>
  <rect x="44" y="234" width="33" height="34" rx="8" fill="url(#cool)">
    <animate attributeName="width" from="0" to="33" dur="1.1s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="92" y="257" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#22D3EE">1,631 tokens</text>
  <text x="956" y="257" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#4E5F7A">26.7× less</text>
</svg>
